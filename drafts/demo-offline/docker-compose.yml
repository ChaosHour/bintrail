# Bintrail offline demo stack.
#
# Topology:
#
#   host mysql client ──► 127.0.0.1:16033 (proxysql) ──┬──► hostgroup 990 ──► mysql (appdb)
#                                                       │
#                                                       └──► hostgroup 991 ──► bintrail-shim
#                                                                              (sidecar of proxysql,
#                                                                               listens on 127.0.0.1:3308)
#                                                                                   │
#                                                                                   └──► mysql (bintrail_index)
#
# Service startup order (encoded via depends_on):
#
#   1. mysql                                           (with seed.sql via /docker-entrypoint-initdb.d)
#   2. bintrail-init     waits for mysql healthy       (runs `bintrail init` + `bintrail snapshot`, then exits 0)
#   3. proxysql          waits for mysql healthy
#   4. bintrail-stream   waits for bintrail-init done  (long-running: `bintrail stream`)
#   5. bintrail-shim     waits for bintrail-init done  (long-running: `bintrail shim` — sidecar of proxysql)
#   6. proxysql-setup    waits for proxysql up         (runs apply-proxysql-config.sh, then exits 0)
#   7. traffic           waits for stream + proxysql   (long-running: traffic.sh)
#
# Image strategy: all bintrail-related sidecars share the
# `bintrail-demo:latest` tag built from drafts/demo-offline/
# Dockerfile. Each service declares both `image:` and `build:` so
# `docker compose up` (or `docker compose build`) produces one
# image used by everything. Repeated `build:` blocks are deduped
# by compose since they share the same image tag.

services:
  mysql:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --server-id=1
    environment:
      MYSQL_ROOT_PASSWORD: demoroot
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdemoroot"]
      interval: 2s
      timeout: 3s
      retries: 60

  proxysql:
    image: proxysql/proxysql:2.6.6
    command: ["proxysql", "-f", "--idle-threads", "-c", "/etc/proxysql.cnf", "--initial"]
    ports:
      - "127.0.0.1:16032:6032"
      - "127.0.0.1:16033:6033"
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy

  bintrail-init:
    image: bintrail-demo:latest
    build:
      context: ../..
      dockerfile: drafts/demo-offline/Dockerfile
    # One-shot: create the index tables, then snapshot appdb's
    # schema. After this exits 0, stream + shim are safe to start.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        echo '==> bintrail init'
        bintrail init --index-dsn='root:demoroot@tcp(mysql:3306)/bintrail_index' --partitions 48
        echo '==> bintrail snapshot'
        bintrail snapshot \
          --source-dsn='root:demoroot@tcp(mysql:3306)/appdb' \
          --index-dsn='root:demoroot@tcp(mysql:3306)/bintrail_index' \
          --schemas=appdb
        echo '==> init done'
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  bintrail-stream:
    image: bintrail-demo:latest
    build:
      context: ../..
      dockerfile: drafts/demo-offline/Dockerfile
    # Long-running: replicate appdb's binlog into the index.
    # server-id=42 must match the shim's tenant server_id.
    command:
      - bintrail
      - stream
      - --source-dsn=repl:replpw@tcp(mysql:3306)/appdb
      - --index-dsn=root:demoroot@tcp(mysql:3306)/bintrail_index
      - --server-id=42
      - --schemas=appdb
      - --batch-size=50
    depends_on:
      bintrail-init:
        condition: service_completed_successfully
    restart: unless-stopped

  bintrail-shim:
    image: bintrail-demo:latest
    build:
      context: ../..
      dockerfile: drafts/demo-offline/Dockerfile
    # Sidecar — share proxysql's network namespace so the shim's
    # 127.0.0.1:3308 IS the address the proxysql routing SQL
    # points at. The shim still reaches `mysql:3306` via the
    # default compose network (network_mode:service:X grants
    # access to the proxysql container's networks).
    network_mode: "service:proxysql"
    command:
      - bintrail
      - shim
      - --listen=127.0.0.1:3308
      - --index-dsn=root:demoroot@tcp(mysql:3306)/bintrail_index
      - --shim-config=/etc/bintrail/shim.yaml
      - --allow-gaps
    volumes:
      - ./shim.yaml:/etc/bintrail/shim.yaml:ro
    depends_on:
      bintrail-init:
        condition: service_completed_successfully
      proxysql:
        # network_mode:service:X requires X to be running first.
        condition: service_started

  proxysql-setup:
    image: bintrail-demo:latest
    build:
      context: ../..
      dockerfile: drafts/demo-offline/Dockerfile
    # One-shot: generate the routing SQL from shim.yaml +
    # BINTRAIL_SOURCE_DSN and apply it to proxysql's admin port.
    environment:
      BINTRAIL_SOURCE_DSN: "app:apppw@tcp(mysql:3306)/appdb"
      PROXYSQL_HOST: proxysql
      PROXYSQL_ADMIN_PORT: "6032"
      PROXYSQL_ADMIN_USER: radminuser
      PROXYSQL_ADMIN_PASS: radminpw
    command: ["bash", "/etc/bintrail/apply-proxysql-config.sh"]
    volumes:
      - ./shim.yaml:/etc/bintrail/shim.yaml:ro
      - ./apply-proxysql-config.sh:/etc/bintrail/apply-proxysql-config.sh:ro
    depends_on:
      proxysql:
        condition: service_started
    restart: "no"

  traffic:
    image: bintrail-demo:latest
    build:
      context: ../..
      dockerfile: drafts/demo-offline/Dockerfile
    # Long-running: synthetic INSERT/UPDATE/DELETE traffic against
    # appdb.orders via proxysql. Skips id=5 (the demo's protected
    # VIP row) and skips id <= 50 for DELETEs (the original seed)
    # so the demo script remains deterministic.
    environment:
      MYSQL_HOST: proxysql
      MYSQL_PORT: "6033"
      MYSQL_USER: app
      MYSQL_PASS: apppw
      MYSQL_DB: appdb
      PROTECTED_ID: "5"
    command: ["bash", "/etc/bintrail/traffic.sh"]
    volumes:
      - ./traffic.sh:/etc/bintrail/traffic.sh:ro
    depends_on:
      bintrail-stream:
        condition: service_started
      proxysql-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Always-on shell with mysql client + bintrail binary, for
  # running ad-hoc commands during the demo. Use:
  #   docker compose exec cli bash
  # …then run mysql / bintrail from inside. demo.sh is mounted so
  # the presenter can `source /etc/bintrail/demo.sh` and use the
  # demo helpers (flashback, recover_pk, etc.).
  cli:
    image: bintrail-demo:latest
    build:
      context: ../..
      dockerfile: drafts/demo-offline/Dockerfile
    command: ["bash", "-c", "tail -f /dev/null"]
    environment:
      BINTRAIL_INDEX_DSN: "root:demoroot@tcp(mysql:3306)/bintrail_index"
      BINTRAIL_SOURCE_DSN: "app:apppw@tcp(mysql:3306)/appdb"
    volumes:
      - ./demo.sh:/etc/bintrail/demo.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
