# Bintrail offline demo — shim tenant config.
#
# One tenant for the demo's 'app' user. The shim validates both the
# username and the cleartext password (mysql_native_password handshake);
# `bintrail proxysql-config` recomputes the SHA1 for ProxySQL's
# mysql_users.password from the same value.
#
# server_id matches the --server-id passed to `bintrail stream`. It
# scopes which events the shim reads — when one bintrail index serves
# multiple source servers, the shim only reconstructs from the tenant's
# server_id.
#
# source_dsn is informational for the shim (it derives default schema
# from the path) — the shim does NOT connect to the source. Only the
# stream / agent / snapshot commands do.

listen: 0.0.0.0:3308

tenants:
  - server_id: "42"
    source_dsn: "app:apppw@tcp(mysql:3306)/appdb"
    mysql_user: "app"
    mysql_password: "apppw"
